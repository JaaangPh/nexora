<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="nexoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B5B" />
      <stop offset="50%" stop-color="#2459C4" />
      <stop offset="100%" stop-color="#18B7D5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18B7D5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2459C4" stop-opacity="0.9" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#142B5B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring with Dynamic Tech Cuts -->
  <circle cx="60" cy="60" r="54" stroke="url(#nexoraGrad)" stroke-width="4.5" stroke-dasharray="280 20" stroke-linecap="round" />
  
